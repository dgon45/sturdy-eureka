<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShotCraft</title>
<meta name="theme-color" content="#12151f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column builder, sticky header + ad bar, step chips on top, live prompt card pinned below the options */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --line:#d9dce7; --fg:#1d2233; --muted:#5f667d;
  --accent:#c9700f; --accent-ink:#ffffff; --accent-soft:#fbead6; --sel:#1f3a8a; --sel-soft:#e3e9fb;
  --ad:#eef0f5; --shade:rgba(20,24,40,.55);
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151f; --surface:#1b1f2c; --line:#2d3346; --fg:#e8eaf2; --muted:#9aa1b8;
  --accent:#f0a24a; --accent-ink:#1b1206; --accent-soft:#3a2a17; --sel:#9db4ff; --sel-soft:#24305a;
  --ad:#232838; --shade:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151f; --surface:#1b1f2c; --line:#2d3346; --fg:#e8eaf2; --muted:#9aa1b8;
  --accent:#f0a24a; --accent-ink:#1b1206; --accent-soft:#3a2a17; --sel:#9db4ff; --sel-soft:#24305a;
  --ad:#232838; --shade:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-block:32px}
.login .adbar{width:100%;max-width:400px}
.adfoot{padding-block:8px 24px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;display:grid;gap:16px}
.logo{font-family:var(--f-display);font-size:34px;letter-spacing:.04em}
.logo span{color:var(--accent)}
.login p{margin:0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.note{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:#c0392b}
.btn.google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border-color:#747775}
.btn.google svg{width:18px;height:18px;flex:none}
.acct{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12.5px;color:var(--muted);padding-block:4px 0}
.acct .linkbtn{font-size:12.5px}

/* header + ad bar */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.hrow .logo{font-size:24px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.pill{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--ad);color:var(--muted);font-weight:600}
.pill.pro{background:var(--accent-soft);color:var(--accent)}
.linkbtn{background:none;border:none;padding:4px;color:var(--muted);text-decoration:underline;font-size:13px}
.adbar-zone{background:var(--surface);border-bottom:1px solid var(--line);padding-block:6px}
.adbar{width:728px;max-width:100%;height:40px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border:1px dashed var(--line);border-radius:6px;background:var(--ad);font-size:13px;color:var(--muted);overflow:hidden}
.adbar b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.adtag{font-size:10.5px;letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex:none}

/* steps */
main{padding-block:16px 40px;display:grid;gap:16px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.steps .chip{flex-direction:column;justify-content:center;text-align:center;min-width:0;padding:6px 3px;font-size:12.5px;line-height:1.25;gap:1px;border-radius:10px;word-break:keep-all;overflow-wrap:break-word}
@media (max-width:440px){.steps .chip{font-size:11px;letter-spacing:-.01em}}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.chip .n{font-family:var(--f-mono);font-size:11.5px}
.chip.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.chip.done .n{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:grid;gap:14px}
.panel h2{font-size:24px}
.panel .hint{margin:-8px 0 0;color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;display:grid;gap:2px;min-width:0}
.opt small{color:var(--muted);font-family:var(--f-mono);font-size:11px;overflow-wrap:anywhere}
.opt.on{border-color:var(--sel);background:var(--sel-soft)}
.nav{display:flex;justify-content:space-between;gap:8px}
.live{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.live-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prompt{font-family:var(--f-mono);font-size:13.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;min-width:0}
.prompt.empty{color:var(--muted)}
.final{font-size:14.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600}
.copy.big{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:12px;font-size:15px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:30}
.summary{display:grid;gap:4px;font-size:13.5px}
.summary div{display:grid;grid-template-columns:96px 1fr;gap:8px}
.summary span:first-child{color:var(--muted)}

/* ad popup (guest, step 8 copy only) */
.modal{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;z-index:40;padding:20px}
.modal-card{width:100%;max-width:360px;background:var(--surface);border-radius:14px;padding:20px;display:grid;gap:14px;text-align:center}
.adbox{height:250px;max-width:100%;border:1px dashed var(--line);border-radius:8px;background:var(--ad);display:grid;place-items:center;color:var(--muted);font-size:13px}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.col{display:grid;gap:16px;min-width:0;align-content:start}
.ai{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.ai p{margin:0;font-size:12px;color:var(--muted)}
.ai-list{display:flex;flex-wrap:wrap;gap:6px}
.ai-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-weight:600;font-size:12.5px;line-height:1.4;min-width:0}
.ai-ic{display:inline-flex;flex:none;color:var(--fg)}
.ai-ic svg{width:16px;height:16px;display:block}
.ai-nm{flex:1;min-width:0}
.ai-btn .go{color:var(--accent);font-family:var(--f-mono);font-size:11px;flex:none}
.ai-btn:hover{border-color:var(--accent)}
.ai-btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.ai-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (min-width:900px){
  .wrap{max-width:1040px}
  .layout{grid-template-columns:minmax(0,1fr) 180px}
  .ai{position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);align-self:start}
  .ai-list{display:grid;grid-template-columns:1fr}
  .ai-btn{padding:6px 10px}
}
@media (prefers-reduced-motion:no-preference){.opt,.chip{transition:border-color .15s,background .15s}}
/* v4: camera diagrams, grouped options, final prompt segments with keep */
.group{display:grid;gap:8px}
.group + .group{border-top:1px solid var(--line);padding-top:12px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.group-h .note{font-size:12px}
.grid.cam{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.opt .dg{width:100%;max-width:100%;height:auto;aspect-ratio:3/2;display:block;margin-bottom:4px;background:var(--surface);border-radius:6px}
.opt.on .dg{background:var(--bg)}
.dg .fig{stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dg .fig-ghost{opacity:.4}
.dg .fr{stroke:var(--fg);stroke-width:1.6;fill:none}
.dg .fr0{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-dasharray:3 3}
.dg .ar{stroke:var(--accent);stroke-width:1.8;fill:none;stroke-linecap:round}
.dg .arh{fill:var(--accent)}
.dg .cam{fill:var(--sel)}
.dg .sight{stroke:var(--sel);stroke-width:1.2;stroke-dasharray:2 3;fill:none}
.opt{position:relative}
.opt .kbadge{position:absolute;top:6px;right:6px;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 6px}
.segs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{font-family:var(--f-mono);font-size:13px;line-height:1.45;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;max-width:100%;overflow-wrap:anywhere}
.seg.kept{color:var(--accent);background:var(--accent-soft);border-color:var(--accent);font-weight:500}
.seg.pick{outline:2px solid var(--sel);outline-offset:1px}
.seg-label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.keepbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.keepbar .what{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.keepbar .what b{font-family:var(--f-mono);font-weight:500}
.keepbtn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 14px;font-weight:600;font-size:13.5px}
.keepbtn.off{background:var(--surface);color:var(--accent)}
.keepinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.modal-card.left{text-align:left}
.modal-card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.modal-card p{margin:0;color:var(--muted);font-size:14px}
/* v6: language picker, copy lock, kept color everywhere */
.noselect,.noselect *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pv.kept{color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 3px;font-weight:500}
.opt.kept{border-color:var(--accent);border-style:dashed}
.opt.kept .oname{color:var(--accent);font-weight:600}
.opt.kept.on{border-style:solid;background:var(--accent-soft)}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.lang{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px}
.lang.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}
.keepbtn:disabled{opacity:.45;cursor:not-allowed}
.who{flex-wrap:wrap;justify-content:flex-end;min-width:0}
@media (max-width:440px){.who .uname{display:none}.hrow .logo{font-size:21px}}
#langSel{font:inherit;font-size:12.5px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
.field.custom{border-top:1px dashed var(--line);padding-top:12px}
</style>

<div id="app"></div>

<script src="firebase-config.js"></script>

// ============ STEPS ============
// each step lists option groups; a group's key is where its choice is stored in S.v
const STEPS=[
  {groups:()=>[{key:"genre",list:GENRES}]},
  {groups:()=>S.v.genre?[{key:"subject",multi:true,list:SUBJECTS[S.v.genre]||[]}]:null},
  {groups:()=>[{key:"face",title:"표정",list:FACES},{key:"gaze",title:"시선",list:GAZES},{key:"tone",title:"말투 · 대화 톤",note:"대사가 있거나 소리 나는 AI(Veo, Sora 등)에서 효과",list:TONES}]},
  {groups:()=>[{key:"action",list:ACTIONS}]},
  {groups:()=>[{key:"place",list:PLACES}]},
  {groups:()=>[
    {key:"shot",title:"화면 크기",note:"사람이 얼마나 크게 보일지",list:SHOTS,cam:true},
    {key:"move",title:"카메라 움직임",note:"영상 동안 화면이 어떻게 움직일지",list:MOVES,cam:true},
    {key:"angle",title:"카메라 높이 · 각도",note:"파란 세모가 카메라",list:ANGLES,cam:true}]},
  {groups:()=>[{key:"light",list:LIGHTS}]},
  {groups:()=>[{key:"style",list:STYLES},{key:"ratio",title:"화면 비율",list:RATIOS,fixed:true},{key:"dur",title:"길이",list:DURATIONS,fixed:true}]},
  {groups:()=>QUALITY.map(q=>({key:q.key,title:q.title,note:q.note,multi:true,list:q.list}))},
  {final:true},
];
const LAST=STEPS.length-1;
const SINGLE_KEYS=["genre","face","gaze","tone","action","place","shot","move","angle","light","style"];
const LISTS={genre:GENRES,face:FACES,gaze:GAZES,tone:TONES,action:ACTIONS,place:PLACES,shot:SHOTS,move:MOVES,angle:ANGLES,light:LIGHTS,style:STYLES};
QUALITY.forEach(q=>LISTS[q.key]=q.list);

// ============ STATE ============
const freshV=()=>({genre:null,subject:[],ratio:"16:9",dur:"8",...Object.fromEntries(QUALITY.map(q=>[q.key,[]]))});
const S={user:null,step:0,v:freshV(),custom:{},pick:null,modal:null};
let KEEP=[],LANG="ko";
// each user on this device gets their own kept words and work in progress
const uid=u=>u.guest?"guest":u.google?"g:"+u.uid:"u:"+u.name.normalize("NFC").toLowerCase();
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
try{const u=JSON.parse(localStorage.getItem("pc_user")||"null");if(u&&u.name)S.user=u;}catch(e){}
try{const l=localStorage.getItem("pc_lang");if(LANGS.some(x=>x.id===l))LANG=l;}catch(e){}
// older versions kept one shared list for the whole device: hand it to whoever is signed in
try{const old=lsGet("pc_keep",null);if(Array.isArray(old)){if(S.user&&!localStorage.getItem("pc_keep:"+uid(S.user)))lsSet("pc_keep:"+uid(S.user),old);localStorage.removeItem("pc_keep");}}catch(e){}
const loadKeep=()=>{const k=S.user?lsGet("pc_keep:"+uid(S.user),[]):[];KEEP=Array.isArray(k)?k:[];};
const saveKeep=()=>{if(S.user){lsSet("pc_keep:"+uid(S.user),KEEP);cloudDirty();}};
// Pro codes entered on this device are remembered per user
const proList=()=>{const l=lsGet("pc_pro",[]);return Array.isArray(l)?l:[];};
const rememberPro=u=>{const l=proList();if(!l.includes(uid(u)))lsSet("pc_pro",[...l,uid(u)]);};
// render() saves every time, so only a real change marks the work for cloud upload
function saveWork(){
  if(!S.user)return;
  const w={v:S.v,custom:S.custom,step:S.step},j=JSON.stringify(w),k=uid(S.user);
  if(saveWork.last===k+j)return;
  const first=saveWork.last===undefined||!saveWork.last.startsWith(k+"{");
  saveWork.last=k+j;lsSet("pc_work:"+k,w);
  if(!first)cloudDirty();
}
function loadWork(){
  const w=S.user&&lsGet("pc_work:"+uid(S.user),null);
  if(!w||typeof w!=="object"||!w.v)return false;
  S.v={...freshV(),...w.v};S.custom=w.custom&&typeof w.custom==="object"?w.custom:{};
  S.step=Number.isInteger(w.step)&&w.step>=0&&w.step<STEPS.length?w.step:0;S.pick=null;
  saveWork.last=undefined;
  return true;
}
loadKeep();
const isPro=()=>!!(S.user&&S.user.pro);
const find=(list,id)=>(list||[]).find(x=>x.id===id);
const isKept=key=>isPro()&&KEEP.includes(key);
function setLang(l){LANG=l;try{localStorage.setItem("pc_lang",l);}catch(e){}document.documentElement.lang=l;render();}

// ============ TEXT ============
function tr(s,vars){
  let out=s;
  if(LANG!=="ko"){const row=UI[s];if(row)out=row[LANG==="en"?0:1];}
  if(vars)Object.keys(vars).forEach(k=>out=out.replace("{"+k+"}",vars[k]));
  return out;
}
const stepText=i=>STEP_TEXT[LANG][i];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const emojiOf=label=>{const m=/^([^\p{L}\p{N}]+)\s/u.exec(label||"");return m?m[1]+" ":"";};
// option name in the screen language (with emoji) and without emoji for the preview
function oname(o){
  if(LANG==="ko")return o.label;
  const n=LANG==="en"?(EN[o.id]||cap(o.en||o.label)):(ES[o.id]||o.label);
  return emojiOf(o.label)+n;
}
const plain=o=>oname(o).replace(/^[^\p{L}\p{N}]+\s/u,"");
// the English phrase under each option, skipped where it would repeat the name
const osub=o=>o.en&&!(LANG==="en"&&!EN[o.id])?o.en:"";

// put every kept word back in (Pro only)
function applyKept(){
  if(!isPro())return;
  KEEP.forEach(k=>{
    const i=k.indexOf(":"),g=k.slice(0,i),id=k.slice(i+1);
    if(g==="extra"){S.custom[7]=id;return;}
    if(/^c\d+$/.test(g)){S.custom[+g.slice(1)]=id;return;}
    if(g==="fmt"){const [r,d]=id.split("|");S.v.ratio=r;S.v.dur=d;return;}
    if(Array.isArray(S.v[g])){if(!S.v[g].includes(id))S.v[g].push(id);}
    else S.v[g]=id;
  });
  // a kept 주인공 only shows under its own 장르, so bring that 장르 back too
  if(!S.v.genre&&S.v.subject.length){const g=Object.keys(SUBJECTS).find(k=>SUBJECTS[k].some(x=>x.id===S.v.subject[0]));if(g)S.v.genre=g;}
  if(S.v.genre)S.v.subject=S.v.subject.filter(id=>(SUBJECTS[S.v.genre]||[]).some(x=>x.id===id));
}
function resetAll(){S.v=freshV();S.custom={};S.pick=null;S.step=0;applyKept();}

// ============ PROMPT ============
// segments: one per chosen word so each can be picked and kept.
// text = English (what gets copied), view = screen language (what is shown)
function segments(){
  const out=[],avoid=[];
  const opt=(g,o)=>out.push({key:g+":"+o.id,text:o.en,view:plain(o)});
  const one=g=>{const o=find(LISTS[g],S.v[g]);if(o)opt(g,o);};
  const cust=i=>{const c=(S.custom[i]||"").trim();if(c)out.push({key:"c"+i+":"+c,text:c,view:c});};
  ["shot","move","angle"].forEach(one);cust(5);
  (SUBJECTS[S.v.genre]||[]).filter(x=>S.v.subject.includes(x.id)).forEach(o=>opt("subject",o));cust(1);
  ["face","gaze","tone"].forEach(one);cust(2);
  one("action");cust(3);
  one("place");cust(4);
  const gn=find(GENRES,S.v.genre);if(gn)out.push({key:"genre:"+gn.id,text:gn.en+" setting",view:plain(gn)});cust(0);
  one("light");cust(6);
  one("style");cust(7);
  QUALITY.forEach(q=>q.list.filter(o=>S.v[q.key].includes(o.id)).forEach(o=>{
    (q.avoid?avoid:out).push({key:q.key+":"+o.id,text:o.en,view:plain(o)});
  }));cust(8);
  const fmt=S.step>=7?{key:"fmt:"+S.v.ratio+"|"+S.v.dur,text:`--ar ${S.v.ratio} --duration ${S.v.dur}s`,
    view:plain(find(RATIOS,S.v.ratio))+" · "+plain(find(DURATIONS,S.v.dur))}:null;
  return {out,avoid,fmt};
}
// the English prompt that gets copied
function buildPrompt(){
  const {out,avoid,fmt}=segments();
  if(!out.length&&!avoid.length)return "";
  let t=out.map(s=>s.text).join(", ");
  if(t)t=cap(t)+".";
  if(avoid.length)t+=(t?"\n":"")+"Avoid: "+avoid.map(s=>s.text).join(", ")+".";
  if(fmt)t+="\n"+fmt.text;
  return t;
}
// the same prompt shown in the screen language, kept words colored
function previewHtml(){
  const {out,avoid,fmt}=segments();
  if(!out.length&&!avoid.length)return "";
  const span=s=>`<span class="pv${isKept(s.key)?" kept":""}">${esc(s.view)}</span>`;
  let h=out.map(span).join(", ");
  if(avoid.length)h+=(h?"\n":"")+tr("피하기")+": "+avoid.map(span).join(", ");
  if(fmt)h+="\n"+span(fmt);
  return h;
}

// ============ CAMERA DIAGRAMS ============
function person(cx,cy,s,cls){
  const h=cy-14*s;
  return `<g class="fig ${cls||""}"><circle cx="${cx}" cy="${h}" r="${4*s}"/><path d="M${cx} ${cy-10*s}V${cy+4*s}M${cx-7*s} ${cy-3*s}L${cx} ${cy-8*s}L${cx+7*s} ${cy-3*s}M${cx-6*s} ${cy+16*s}L${cx} ${cy+4*s}L${cx+6*s} ${cy+16*s}"/></g>`;
}
function arrow(x1,y1,x2,y2){
  const a=Math.atan2(y2-y1,x2-x1),L=6;
  const p=(d)=>[x2-L*Math.cos(a+d),y2-L*Math.sin(a+d)].map(n=>n.toFixed(1)).join(",");
  return `<line class="ar" x1="${x1}" y1="${y1}" x2="${(x2-3*Math.cos(a)).toFixed(1)}" y2="${(y2-3*Math.sin(a)).toFixed(1)}"/><polygon class="arh" points="${x2},${y2} ${p(.45)} ${p(-.45)}"/>`;
}
const rect=(r,cls)=>`<rect class="${cls}" x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="2"/>`;
function diagram(d){
  let g="";
  if(d.shot){g=person(48,36,1.4)+rect(d.shot,"fr");}
  else if(d.orbit){g=person(48,34,.75)+`<ellipse class="ar" cx="48" cy="46" rx="38" ry="11"/>`+arrow(70,56.5,78,55)+`<polygon class="cam" points="14,40 22,44 14,48"/>`;}
  else if(d.top){g=rect([22,6,52,52],"fr")+`<g class="fig"><ellipse cx="48" cy="32" rx="10" ry="5"/><circle cx="48" cy="32" r="4"/></g>`+arrow(10,6,10,40);}
  else if(d.hand){g=person(48,34,.75)+`<rect class="fr0" x="26" y="11" width="40" height="40" rx="2" transform="rotate(-5 46 31)"/>`+rect([30,13,40,40],"fr")+`<path class="ar" d="M22 60l6-4 6 4 6-4 6 4 6-4 6 4 6-4 6 4"/>`;}
  else if(d.cam){g=person(64,36,.85)+`<line class="sight" x1="${d.cam[0]+6}" y1="${d.cam[1]}" x2="${d.to[0]}" y2="${d.to[1]}"/><polygon class="cam" points="${d.cam[0]},${d.cam[1]-4} ${d.cam[0]+8},${d.cam[1]} ${d.cam[0]},${d.cam[1]+4}"/>`;}
  else if(d.pov){g=rect([6,4,84,56],"fr")+`<g class="fig"><path d="M30 60c0-8 4-12 8-12s6 4 6 12M66 60c0-8-4-12-8-12s-6 4-6 12"/></g>`+`<circle class="arh" cx="48" cy="26" r="2"/>`;}
  else if(d.dutch){g=person(48,34,.85)+`<rect class="fr" x="26" y="10" width="44" height="44" rx="2" transform="rotate(-14 48 32)"/>`;}
  else{
    if(d.follow){const sx=d.s[0]+d.s[2]/2,ex=d.e[0]+d.e[2]/2;g+=person(sx,d.s[1]+d.s[3]/2,.7,"fig-ghost")+person(ex,d.e[1]+d.e[3]/2,.7);}
    else g+=person(48,34,.75);
    if(d.s)g+=rect(d.s,"fr0");
    g+=rect(d.e,"fr");
    if(d.s){
      const c=r=>[r[0]+r[2]/2,r[1]+r[3]/2],[x1,y1]=c(d.s),[x2,y2]=c(d.e);
      if(Math.hypot(x2-x1,y2-y1)<10){g+=arrow(d.s[0],d.s[1],d.e[0],d.e[1])+arrow(d.s[0]+d.s[2],d.s[1]+d.s[3],d.e[0]+d.e[2],d.e[1]+d.e[3]);
        if(d.fast)g+=arrow(d.s[0]+d.s[2],d.s[1],d.e[0]+d.e[2],d.e[1])+arrow(d.s[0],d.s[1]+d.s[3],d.e[0],d.e[1]+d.e[3]);}
      else if(d.follow)g+=arrow(x1,62,x2,62);
      else g+=arrow(x1,y1,x2,y2);
    }
  }
  return `<svg class="dg" viewBox="0 0 96 64" aria-hidden="true">${g}</svg>`;
}

// ============ COPY ============
// the prompt areas cannot be selected or copied by hand; only the copy buttons copy
let allowCopy=false;
["copy","cut"].forEach(ev=>document.addEventListener(ev,e=>{
  if(allowCopy)return;
  const sel=getSelection(),n=sel&&sel.anchorNode;
  const el=n&&(n.nodeType===1?n:n.parentElement);
  if(el&&el.closest(".noselect")){e.preventDefault();toast(tr("복사는 복사 버튼으로만 할 수 있어요"));}
}));
["contextmenu","dragstart","selectstart"].forEach(ev=>document.addEventListener(ev,e=>{
  if(e.target.closest&&e.target.closest(".noselect"))e.preventDefault();
}));
// the toast lives outside #app so showing it never redraws the screen (and never steals focus from a text box)
function toast(msg){
  let el=document.getElementById("toastEl");
  if(!el){el=document.createElement("div");el.id="toastEl";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.textContent=msg;el.hidden=false;
  clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true;},1900);
}
function copyText(text,okMsg){
  const ok=()=>toast(okMsg||tr("복사했어요"));
  try{navigator.clipboard.writeText(text).then(ok,()=>legacyCopy(text,ok));}
  catch(e){legacyCopy(text,ok);}
}
function legacyCopy(text,ok){
  const ta=document.createElement("textarea");
  ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);ta.select();
  allowCopy=true;let done=false;
  try{done=document.execCommand("copy");}catch(e){}
  allowCopy=false;ta.remove();
  done?ok():toast(tr("자동 복사가 막혀 있어요. 복사 버튼을 다시 눌러 주세요"));
}
function copyLive(){const t=buildPrompt();if(t)copyText(t);}
// final prompt: guests see the ad popup first
function copyFinal(){
  const t=buildPrompt();if(!t)return;
  if(isPro()){copyText(t);return;}
  startAd(1);
}
// two 5-second ads in a row before the copy
function startAd(n){
  S.modal={type:"ad",left:5,n};render();
  const tick=setInterval(()=>{
    if(!S.modal||S.modal.type!=="ad"){clearInterval(tick);return;}
    S.modal.left--;render();
    if(S.modal.left<=0)clearInterval(tick);
  },1000);
}

// ============ KEEP ============
function toggleKeep(){
  if(!S.pick)return;
  if(!isPro()){S.modal={type:"pro",err:""};render();return;}
  if(KEEP.includes(S.pick)){KEEP=KEEP.filter(k=>k!==S.pick);toast(tr("유지를 풀었어요"));}
  else{
    // one kept value per single-choice group
    const g=S.pick.split(":")[0];
    if(SINGLE_KEYS.includes(g)||/^c\d+$/.test(g)||g==="fmt")KEEP=KEEP.filter(k=>k.split(":")[0]!==g);
    KEEP.push(S.pick);toast(tr("유지했어요. 다음 영상에도 자동으로 들어가요"));
  }
  saveKeep();
}

// ============ CLOUD: Google sign-in + sync (only when firebase-config.js is filled in) ============
// users/{uid} = {keep, work, pro, t}; t is the time of the last change, the newer copy wins
const FB="https://www.gstatic.com/firebasejs/10.12.2/";
const CLOUD={on:!!(window.SHOTCRAFT_FIREBASE&&window.SHOTCRAFT_FIREBASE.apiKey),ready:null,auth:null,db:null,timer:null};
const loadScript=src=>new Promise((ok,no)=>{const el=document.createElement("script");el.src=src;el.onload=ok;el.onerror=no;document.head.appendChild(el);});
function cloudInit(){
  if(!CLOUD.on)return Promise.reject(new Error("off"));
  if(!CLOUD.ready)CLOUD.ready=(async()=>{
    await loadScript(FB+"firebase-app-compat.js");
    await Promise.all([loadScript(FB+"firebase-auth-compat.js"),loadScript(FB+"firebase-firestore-compat.js")]);
    if(!firebase.apps.length)firebase.initializeApp(window.SHOTCRAFT_FIREBASE);
    CLOUD.auth=firebase.auth();CLOUD.db=firebase.firestore();
  })().catch(e=>{CLOUD.ready=null;throw e;});
  return CLOUD.ready;
}
const cloudDoc=u=>CLOUD.db.collection("users").doc(u.uid);
const signedIn=u=>!!(u&&u.google&&CLOUD.auth&&CLOUD.auth.currentUser&&CLOUD.auth.currentUser.uid===u.uid);
function cloudDirty(){
  if(!S.user||!S.user.google)return;
  lsSet("pc_t:"+uid(S.user),Date.now());
  clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,1500);
}
async function cloudPush(){
  clearTimeout(CLOUD.timer);CLOUD.timer=null;
  const u=S.user;if(!signedIn(u))return;
  const k=uid(u);
  // JSON round trip drops undefined values, which Firestore refuses
  const data=JSON.parse(JSON.stringify({keep:lsGet("pc_keep:"+k,[]),work:lsGet("pc_work:"+k,null),pro:!!u.pro,t:lsGet("pc_t:"+k,0)||Date.now()}));
  try{await cloudDoc(u).set(data);}catch(e){}
}
// take the cloud copy when it is newer than this device's, otherwise upload ours
async function cloudPull(){
  const u=S.user;if(!signedIn(u))return;
  const k=uid(u);
  let d=null;try{const snap=await cloudDoc(u).get();d=snap.exists?snap.data():null;}catch(e){return;}
  if(S.user!==u)return;
  const localT=lsGet("pc_t:"+k,0);
  let changed=false;
  if(d&&d.pro&&!u.pro){S.user={...u,pro:true};saveUser();rememberPro(S.user);changed=true;}
  if(d&&(d.t||0)>localT){
    if(Array.isArray(d.keep))lsSet("pc_keep:"+k,d.keep);
    if(d.work)lsSet("pc_work:"+k,d.work);
    lsSet("pc_t:"+k,d.t);
    loadKeep();if(!loadWork())resetAll();
    changed=true;
  }else if(!d||localT>(d.t||0)||(S.user.pro&&!d.pro))cloudPush();
  if(changed){render();toast(tr("동기화됨"));}
}
function loginErr(msg){const el=document.getElementById("loginErr");if(el){el.textContent=msg;el.hidden=!msg;}}
async function googleLogin(){
  const btn=document.getElementById("googleBtn");
  loginErr("");if(btn){btn.disabled=true;btn.querySelector("span").textContent=tr("로그인 중…");}
  const reset=()=>{if(btn){btn.disabled=false;btn.querySelector("span").textContent=tr("Google로 시작하기");}};
  try{
    await cloudInit();
    const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    let r;
    try{r=await CLOUD.auth.signInWithPopup(p);}
    catch(e){
      // some app shells block pop-ups: go through a full-page redirect instead
      if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){await CLOUD.auth.signInWithRedirect(p);return;}
      throw e;
    }
    finishGoogle(r.user);
  }catch(e){
    reset();
    const code=e&&e.code||"";
    if(code==="auth/popup-closed-by-user"||code==="auth/cancelled-popup-request")return;
    loginErr(code==="auth/network-request-failed"||!navigator.onLine||!code?tr("인터넷 연결을 확인해 주세요."):tr("Google 로그인에 실패했어요. 잠시 후 다시 해 주세요.")+" ("+code+")");
  }
}
function finishGoogle(fu){
  const u={google:true,uid:fu.uid,name:fu.displayName||fu.email||"Google",email:fu.email||"",pro:false};
  const k=uid(u),prev=lsGet("pc_last",null);
  // first Google sign-in on this device: bring along what was made as guest (or under the old name login)
  if(prev&&prev!==k&&localStorage.getItem("pc_work:"+k)==null){
    const w=lsGet("pc_work:"+prev,null),kp=lsGet("pc_keep:"+prev,null);
    if(w)lsSet("pc_work:"+k,w);
    if(Array.isArray(kp))lsSet("pc_keep:"+k,kp);
    if(proList().includes(prev))u.pro=true;
  }
  try{localStorage.removeItem("pc_last");}catch(e){}
  login(u);cloudPull();
}
async function deleteAccount(){
  const u=S.user;if(!u||!u.google)return;
  if(!confirm(tr("계정을 삭제할까요? 클라우드에 저장된 작업, 유지한 단어, Pro 기록이 모두 지워지고 되돌릴 수 없어요.")))return;
  try{
    await cloudInit();
    if(!signedIn(u))throw new Error("signed out");
    clearTimeout(CLOUD.timer);
    await cloudDoc(u).delete();
    const fu=CLOUD.auth.currentUser;
    try{await fu.delete();}
    catch(e){
      if(e&&e.code==="auth/requires-recent-login"){await fu.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());await fu.delete();}
      else throw e;
    }
    const k=uid(u);
    ["pc_work:","pc_keep:","pc_t:"].forEach(x=>{try{localStorage.removeItem(x+k);}catch(e){}});
    lsSet("pc_pro",proList().filter(x=>x!==k));
    clearLocalSession();render();toast(tr("계정을 삭제했어요"));
  }catch(e){toast(tr("계정 삭제에 실패했어요. 다시 로그인한 뒤 해 주세요."));}
}

function bind(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  const go=i=>{S.step=i;S.pick=null;render();scrollTo(0,0);};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,id=b.dataset.id,cur=S.v[k];
    if(Array.isArray(cur))S.v[k]=cur.includes(id)?cur.filter(x=>x!==id):[...cur,id];
    else if(k==="genre"){if(cur!==id){S.v.genre=id;S.v.subject=[];}}
    else if(k==="ratio"||k==="dur")S.v[k]=id;
    else S.v[k]=cur===id?null:id;
    render();
  });
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>go(+b.dataset.step));
  app.querySelectorAll(".seg").forEach(b=>b.onclick=()=>{S.pick=S.pick===b.dataset.seg?null:b.dataset.seg;render();});
  on("prevBtn",()=>go(Math.max(0,S.step-1)));
  on("nextBtn",()=>go(Math.min(LAST,S.step+1)));
  on("copyLive",copyLive);
  on("copyFinal",copyFinal);
  on("keepBtn",()=>{toggleKeep();render();});
  on("clearKeep",()=>{KEEP=[];saveKeep();render();toast(tr("유지를 모두 풀었어요"));});
  on("adClose",()=>{if(S.modal&&S.modal.left<=0&&S.modal.n<2){startAd(2);return;}if(S.modal&&S.modal.left<=0){const t=buildPrompt();S.modal=null;render();if(t)copyText(t);}});
  on("proClose",()=>{S.modal=null;render();});
  const pf=document.getElementById("proForm");
  if(pf)pf.onsubmit=e=>{
    e.preventDefault();
    const code=document.getElementById("proCode").value.trim().toUpperCase();
    if(code!=="PRO-DEMO"){S.modal.err=tr("Pro 코드가 맞지 않아요.");render();return;}
    S.user={...S.user,pro:true};saveUser();rememberPro(S.user);cloudDirty();
    S.modal=null;toggleKeep();render();
  };
  on("resetBtn",()=>{resetAll();render();scrollTo(0,0);});
  on("logoutBtn",logout);
  on("deleteAcct",deleteAccount);
  const ls=document.getElementById("langSel");if(ls)ls.onchange=e=>setLang(e.target.value);
  app.querySelectorAll(".ai-btn").forEach(a=>a.onclick=e=>{
    const t2=buildPrompt();
    if(!t2){e.preventDefault();toast(tr("먼저 항목을 골라 프롬프트를 만들어 주세요"));return;}
    copyText(t2,tr("{name} 열기 · 프롬프트 복사됨",{name:AI_TOOLS[+a.dataset.ai].name}));
  });
  const ex=app.querySelector("[data-cust]");
  if(ex)ex.oninput=e=>{S.custom[+e.target.dataset.cust]=e.target.value;saveWork();const lt=document.getElementById("liveText"),pv=previewHtml();
    if(lt){lt.innerHTML=pv||tr("항목을 고르면 여기에 프롬프트가 바로 만들어져요.");lt.classList.toggle("empty",!pv);}};
}

render();
if(CLOUD.on)cloudInit().then(()=>{
  CLOUD.auth.getRedirectResult().then(r=>{if(r&&r.user&&!S.user)finishGoogle(r.user);}).catch(e=>{if(!S.user)loginErr(tr("Google 로그인에 실패했어요. 잠시 후 다시 해 주세요.")+" ("+(e&&e.code||"")+")");});
  CLOUD.auth.onAuthStateChanged(fu=>{
    if(!S.user||!S.user.google)return;
    if(!fu||fu.uid!==S.user.uid){clearLocalSession();render();return;} // signed out elsewhere or the account was removed
    cloudPull();
  });
}).catch(()=>{}); // offline: keep working from this device's copy
// coming back to the app (e.g. after working on the PC) picks up the newer copy; leaving it uploads ours
document.addEventListener("visibilitychange",()=>{
  if(!S.user||!S.user.google)return;
  if(document.visibilityState==="hidden"){if(CLOUD.timer)cloudPush();}
  else if(!CLOUD.timer)cloudPull();
});
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body></html>
